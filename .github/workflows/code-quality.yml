name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Analysis
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint radon bandit
        pip install -r backend/requirements.txt
    
    - name: Code complexity analysis
      run: |
        radon cc backend/app -a > reports/complexity.txt || true
        radon mi backend/app > reports/maintainability.txt || true
    
    - name: Security check with Bandit
      run: |
        bandit -r backend/app -f json -o bandit-report.json || true
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=face-access-ai
          -Dsonar.organization=your-org
          -Dsonar.sources=backend/app
          -Dsonar.python.version=3.11
