version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=attendance 
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - faceaccess-staging

  redis:
    image: redis:7-alpine
    networks:
      - faceaccess-staging
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_staging_data:/minio_data
    networks:
      - faceaccess-staging
    command: minio server /minio_data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-faceaccess}:${DB_PASSWORD:-SecurePassword123}@postgres:5432/${DB_NAME:-faceaccess_staging}
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
      ENVIRONMENT: staging
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - faceaccess-staging
    labels:
      - "com.example.description=FaceAccess Backend Staging"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://${DB_USER:-faceaccess}:${DB_PASSWORD:-SecurePassword123}@postgres:5432/${DB_NAME:-faceaccess_staging}
      REDIS_URL: redis://redis:6379/0
      MINIO_URL: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - faceaccess-staging

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/app:ro
    depends_on:
      - backend
    networks:
      - faceaccess-staging

volumes:
  postgres_staging_data:
  minio_staging_data:

networks:
  faceaccess-staging:
    driver: bridge