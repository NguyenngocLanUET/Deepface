<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceAccess AI - Đăng Ký</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }
        
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }
        
        .bg-shape {
            position: absolute;
            opacity: 0.05;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
        }
        
        .shape-1 { width: 400px; height: 400px; background: #00d4ff; top: -100px; right: -100px; animation-delay: 0s; }
        .shape-2 { width: 300px; height: 300px; background: #00ff88; bottom: -50px; left: -50px; animation-delay: 5s; }
        .shape-3 { width: 250px; height: 250px; background: #ff006e; top: 50%; left: 10%; animation-delay: 10s; }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(30px, -30px); }
            66% { transform: translate(-20px, 20px); }
        }
        
        .register-container {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .register-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .register-header i {
            font-size: 3rem;
            color: #00d4ff;
            margin-bottom: 15px;
            display: block;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        
        .register-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #fff;
        }
        
        .register-header p {
            color: #00d4ff;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #b0b0b0;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px 12px 10px 35px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
        
        .form-group i {
            position: absolute;
            left: 10px;
            top: 32px;
            color: #00d4ff;
            font-size: 0.95rem;
        }
        
        .error-message {
            padding: 12px 15px;
            background: rgba(255, 0, 110, 0.1);
            border-left: 3px solid #ff006e;
            border-radius: 5px;
            color: #ff6b9d;
            font-size: 0.85rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            padding: 12px 15px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            border-radius: 5px;
            color: #00ff88;
            font-size: 0.85rem;
            display: none;
            animation: slideDown 0.3s ease-out;
        }
        
        .success-message.show {
            display: block;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .register-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #00ff88 100%);
            border: none;
            border-radius: 10px;
            color: #0f0f1e;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }
        
        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            font-size: 0.9rem;
            color: #b0b0b0;
        }
        
        .login-link a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .login-link a:hover {
            color: #00ff88;
        }
        
        .spinner {
            border: 2px solid rgba(0, 212, 255, 0.2);
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            display: inline-block;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .register-container {
                margin: 20px;
                padding: 30px 20px;
            }
            
            .register-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
    </div>
    
    <div class="register-container">
        <div class="register-header">
            <i class="bi bi-person-plus"></i>
            <h1>Tạo tài khoản</h1>
            <p>Đăng ký để sử dụng hệ thống</p>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form class="register-form" id="registerForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <i class="bi bi-person"></i>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Tên đăng nhập"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <i class="bi bi-envelope"></i>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="example@email.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <i class="bi bi-lock"></i>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Mật khẩu (tối thiểu 6 ký tự)"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <i class="bi bi-lock-check"></i>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Xác nhận mật khẩu"
                    required
                >
            </div>
            
            <button type="submit" class="register-btn" id="registerBtn">
                <span id="btnText">Tạo Tài Khoản</span>
            </button>
        </form>
        
        <div class="login-link">
            Đã có tài khoản? 
            <a href="login.html">Đăng nhập</a>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const btnText = document.getElementById('btnText');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (!username || !email || !password || !confirmPassword) {
                showError('Vui lòng điền tất cả các trường');
                return;
            }
            
            if (password.length < 6) {
                showError('Mật khẩu phải có ít nhất 6 ký tự');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp');
                return;
            }
            
            // Disable button
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<div class="spinner"></div>Đang xử lý...';
            clearMessages();
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        full_name: username
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('Đăng ký thành công! Chuyển hướng đến đăng nhập...');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    showError(data.detail || 'Đăng ký thất bại');
                    registerBtn.disabled = false;
                    btnText.textContent = 'Tạo Tài Khoản';
                }
            } catch (error) {
                showError('Lỗi kết nối. Vui lòng thử lại sau.');
                console.error('Register error:', error);
                registerBtn.disabled = false;
                btnText.textContent = 'Tạo Tài Khoản';
            }
        });
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }
        
        function clearMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }
    </script>
</body>
</html>
