services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    restart: always
    tty: true            # Thêm dòng này
    stdin_open: true     # Thêm dòng này
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - temp_faces:/tmp
      - deepface_models:/root/.deepface/weights
    depends_on:
      - db
      - redis
      - qdrant
      - minio
    environment:
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - DATABASE_URL=postgresql://admin:123@db:5432/attendance
      # SỬA LỖI CUDA TẠI ĐÂY
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=3
      - TF_FORCE_GPU_ALLOW_GROWTH=false

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info    
    restart: always
    tty: true            # Thêm dòng này
    stdin_open: true     # Thêm dòng này
    volumes:
      - ./backend:/app
      - temp_faces:/tmp
      - deepface_models:/root/.deepface/weights
    depends_on:
      - redis
      - qdrant
      - minio
    environment:
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - DATABASE_URL=postgresql://admin:123@db:5432/attendance
      # SỬA LỖI CUDA TẠI ĐÂY
      - CUDA_VISIBLE_DEVICES=-1
      - TF_CPP_MIN_LOG_LEVEL=3
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_SECURITY_ALLOW_EMBEDDING=true # Đảm bảo Grafana cài plugin vào volume
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana  # Lưu dữ liệu để không phải cài lại dashboard mỗi khi tắt máy

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "backend:8000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_storage:
  minio_data:
  temp_faces:
  deepface_models:
  grafana_data: # Thêm dòng này nữa