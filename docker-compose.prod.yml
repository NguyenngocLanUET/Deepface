version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER:-faceaccess}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123}
      POSTGRES_DB: ${DB_NAME:-faceaccess_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - faceaccess-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-faceaccess}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - faceaccess-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisPassword123}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_prod_data:/minio_data
    networks:
      - faceaccess-prod
    command: minio server /minio_data --console-address ":9001"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-faceaccess}:${DB_PASSWORD:-SecurePassword123}@postgres:5432/${DB_NAME:-faceaccess_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPassword123}@redis:6379/0
      MINIO_URL: https://minio.example.com
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - faceaccess-prod
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://${DB_USER:-faceaccess}:${DB_PASSWORD:-SecurePassword123}@postgres:5432/${DB_NAME:-faceaccess_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisPassword123}@redis:6379/0
      MINIO_URL: https://minio.example.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - faceaccess-prod
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./:/app:ro
    depends_on:
      - backend
    networks:
      - faceaccess-prod
    restart: always

volumes:
  postgres_prod_data:
  minio_prod_data:

networks:
  faceaccess-prod:
    driver: bridge